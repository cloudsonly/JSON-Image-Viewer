<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="一个纯前端 JSON 图片浏览器：输入 JSON URL，自动识别图片数据并提供搜索、预览、复制与历史记录。" />
  <title>JSON Image Viewer</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --surface: rgba(255, 255, 255, .9);
      --surface-solid: #fff;
      --surface-soft: #f8fafc;
      --text: #0f172a;
      --text-2: #475569;
      --text-3: #94a3b8;
      --border: #e2e8f0;
      --primary: #4f46e5;
      --primary-2: #7c3aed;
      --primary-soft: rgba(79, 70, 229, .1);
      --danger: #dc2626;
      --success: #15803d;
      --warning: #b45309;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, .06);
      --shadow: 0 12px 35px rgba(15, 23, 42, .08);
      --radius: 18px;
      --radius-sm: 12px;
      --max-width: 1440px;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b1120;
      --surface: rgba(15, 23, 42, .88);
      --surface-solid: #0f172a;
      --surface-soft: #111c31;
      --text: #e5e7eb;
      --text-2: #a5b4fc;
      --text-3: #64748b;
      --border: #24324a;
      --primary: #818cf8;
      --primary-2: #a78bfa;
      --primary-soft: rgba(129, 140, 248, .14);
      --danger: #f87171;
      --success: #4ade80;
      --warning: #fbbf24;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .25);
      --shadow: 0 20px 50px rgba(0, 0, 0, .25);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(99, 102, 241, .12), transparent 30%),
        radial-gradient(circle at bottom left, rgba(139, 92, 246, .09), transparent 28%),
        var(--bg);
    }

    button, input { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    :focus-visible { outline: 3px solid rgba(99, 102, 241, .35); outline-offset: 2px; }

    .app { width: min(var(--max-width), calc(100% - 32px)); margin: 0 auto; padding: 24px 0 48px; }

    header { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; margin: 10px 0 22px; }
    .brand { display: flex; gap: 14px; align-items: center; min-width: 0; }
    .brand-mark {
      width: 48px; height: 48px; border-radius: 15px; flex: 0 0 auto;
      display: grid; place-items: center; color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      box-shadow: 0 10px 25px rgba(79, 70, 229, .25);
      font-size: 24px;
    }
    h1 { margin: 0; font-size: clamp(24px, 4vw, 34px); line-height: 1.2; letter-spacing: -.03em; }
    .subtitle { margin: 5px 0 0; color: var(--text-2); max-width: 780px; }

    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .icon-btn, .ghost-btn {
      border: 1px solid var(--border); color: var(--text-2); background: var(--surface-solid);
      border-radius: 11px; min-height: 40px; padding: 0 12px; box-shadow: var(--shadow-sm);
    }
    .icon-btn { width: 40px; padding: 0; display: grid; place-items: center; font-size: 17px; }
    .icon-btn:hover, .ghost-btn:hover { border-color: var(--primary); color: var(--primary); }

    .panel {
      border: 1px solid var(--border); background: var(--surface); backdrop-filter: blur(16px);
      border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 18px;
    }
    .loader-panel { padding: 20px; }
    .loader-grid { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
    .input-wrap { position: relative; }
    .url-input {
      width: 100%; min-height: 48px; padding: 0 100px 0 15px; border: 1px solid var(--border);
      border-radius: 13px; background: var(--surface-solid); color: var(--text); transition: .2s;
    }
    .url-input:focus { outline: 0; border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
    .input-tools { position: absolute; right: 6px; top: 6px; bottom: 6px; display: flex; gap: 4px; }
    .mini-btn { border: 0; border-radius: 9px; padding: 0 9px; background: var(--surface-soft); color: var(--text-2); }
    .mini-btn:hover { background: var(--primary-soft); color: var(--primary); }
    .primary-btn {
      border: 0; min-height: 48px; padding: 0 20px; border-radius: 13px; color: #fff; font-weight: 700;
      background: linear-gradient(135deg, var(--primary), var(--primary-2)); box-shadow: 0 10px 22px rgba(79, 70, 229, .2);
    }
    .primary-btn:disabled { opacity: .6; cursor: wait; }

    .presets { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
    .presets-label { color: var(--text-3); }
    .preset { border: 1px solid var(--border); background: var(--surface-solid); color: var(--text-2); border-radius: 999px; padding: 6px 10px; }
    .preset:hover { color: var(--primary); border-color: var(--primary); }

    .status { min-height: 0; margin-top: 12px; padding: 0 14px; border-radius: 11px; overflow: hidden; display: grid; grid-template-rows: 0fr; transition: .2s; }
    .status > div { min-height: 0; overflow: hidden; }
    .status.show { padding-top: 10px; padding-bottom: 10px; grid-template-rows: 1fr; border: 1px solid var(--border); background: var(--surface-soft); }
    .status[data-type="success"] { color: var(--success); }
    .status[data-type="error"] { color: var(--danger); }
    .status[data-type="loading"] { color: var(--primary); }
    .status[data-type="warning"] { color: var(--warning); }

    .history { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 14px; }
    .history-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 8px; }
    .history-title { font-weight: 700; }
    .history-list { display: grid; gap: 7px; }
    .history-empty { color: var(--text-3); font-size: 13px; padding: 6px 0; }
    .history-item { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; border: 1px solid var(--border); background: var(--surface-solid); border-radius: 11px; padding: 8px 10px; }
    .history-load { min-width: 0; border: 0; background: none; color: inherit; text-align: left; padding: 0; }
    .history-name { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-url { display: block; color: var(--text-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-remove { border: 0; background: transparent; color: var(--text-3); width: 32px; height: 32px; border-radius: 8px; }
    .history-remove:hover { color: var(--danger); background: rgba(220, 38, 38, .08); }

    .gallery-panel { padding: 18px; }
    .gallery-head { display: flex; gap: 14px; align-items: center; justify-content: space-between; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
    .title-block { min-width: 0; }
    .gallery-title { margin: 0; font-size: 18px; }
    .gallery-meta { color: var(--text-3); font-size: 13px; margin-top: 2px; }
    .gallery-tools { display: flex; gap: 8px; align-items: center; }
    .search { width: min(360px, 45vw); min-height: 42px; padding: 0 13px; border: 1px solid var(--border); border-radius: 11px; background: var(--surface-solid); color: var(--text); }
    .search:focus { outline: 0; border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }

    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(205px, 1fr)); gap: 14px; padding-top: 16px; }
    .card { min-width: 0; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; background: var(--surface-solid); transition: transform .2s, box-shadow .2s, border-color .2s; }
    .card:hover { transform: translateY(-3px); border-color: rgba(99, 102, 241, .35); box-shadow: 0 14px 30px rgba(15, 23, 42, .1); }
    .thumb { aspect-ratio: 4 / 3; position: relative; display: grid; place-items: center; overflow: hidden; background: repeating-conic-gradient(from 45deg, var(--surface-soft) 0 25%, transparent 0 50%) 50% / 18px 18px; }
    .thumb img { width: 100%; height: 100%; object-fit: contain; transition: transform .3s ease; }
    .card:hover .thumb img { transform: scale(1.03); }
    .thumb button { position: absolute; inset: 0; opacity: 0; border: 0; background: rgba(15, 23, 42, .18); color: #fff; font-size: 28px; transition: opacity .2s; }
    .card:hover .thumb button, .thumb button:focus-visible { opacity: 1; }
    .card-body { padding: 12px; }
    .name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .url { color: var(--text-3); font-size: 12px; margin-top: 4px; height: 36px; line-height: 18px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; word-break: break-all; }
    .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 10px; }
    .card-btn { min-height: 35px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface-soft); color: var(--text-2); }
    .card-btn:hover { border-color: var(--primary); color: var(--primary); }

    .empty { grid-column: 1 / -1; padding: 70px 20px; text-align: center; color: var(--text-3); }
    .empty-icon { font-size: 42px; opacity: .75; margin-bottom: 10px; }
    .empty strong { display: block; color: var(--text-2); font-size: 17px; margin-bottom: 4px; }

    footer { color: var(--text-3); font-size: 12px; text-align: center; padding: 18px 0 0; }

    .modal { position: fixed; inset: 0; z-index: 1000; display: none; background: rgba(2, 6, 23, .82); backdrop-filter: blur(8px); }
    .modal.open { display: grid; grid-template-rows: auto 1fr; }
    .viewer-top { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 12px; color: #fff; }
    .viewer-info { min-width: 0; }
    .viewer-title { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .viewer-subtitle { opacity: .72; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .viewer-actions { display: flex; gap: 6px; }
    .viewer-btn { border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.08); color: #fff; border-radius: 10px; min-width: 38px; min-height: 38px; }
    .viewer-btn:hover { background: rgba(255,255,255,.16); }
    .viewer-stage { min-height: 0; display: grid; place-items: center; padding: 8px 70px 22px; position: relative; }
    .viewer-image-wrap { width: 100%; height: 100%; display: grid; place-items: center; overflow: hidden; }
    .viewer-image { max-width: 100%; max-height: 100%; object-fit: contain; transform-origin: center; user-select: none; -webkit-user-drag: none; }
    .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); border: 0; width: 48px; height: 72px; border-radius: 14px; background: rgba(255,255,255,.08); color: #fff; font-size: 30px; }
    .nav-btn:hover { background: rgba(255,255,255,.15); }
    .prev { left: 12px; } .next { right: 12px; }
    .viewer-count { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); color: rgba(255,255,255,.75); font-size: 12px; padding: 5px 9px; border-radius: 999px; background: rgba(255,255,255,.08); }

    @media (max-width: 800px) {
      .app { width: min(var(--max-width), calc(100% - 20px)); padding-top: 12px; }
      header { align-items: center; }
      .toolbar { flex-wrap: nowrap; }
      .subtitle { font-size: 13px; }
      .loader-grid { grid-template-columns: 1fr; }
      .primary-btn { width: 100%; }
      .gallery-head { align-items: stretch; flex-direction: column; }
      .gallery-tools { width: 100%; }
      .search { width: 100%; }
      .gallery { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
      .viewer-stage { padding-left: 54px; padding-right: 54px; }
    }

    @media (max-width: 520px) {
      .brand-mark { width: 42px; height: 42px; }
      h1 { font-size: 23px; }
      .loader-panel, .gallery-panel { padding: 14px; }
      .gallery { gap: 10px; }
      .card-body { padding: 10px; }
      .url { display: none; }
      .viewer-stage { padding-left: 46px; padding-right: 46px; }
      .nav-btn { width: 38px; height: 56px; }
      .viewer-actions .viewer-btn:nth-child(1) { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">▧</div>
        <div>
          <h1>JSON Image Viewer</h1>
          <p class="subtitle">读取 JSON 中的图片地址，以画廊方式浏览。无需后端，数据仅在当前浏览器处理。</p>
        </div>
      </div>
      <div class="toolbar">
        <button class="icon-btn" id="themeBtn" type="button" title="切换主题" aria-label="切换主题">◐</button>
        <a class="icon-btn" href="https://github.com/cloudsonly/JSON-Image-Viewer" target="_blank" rel="noopener noreferrer" title="GitHub" aria-label="打开 GitHub">GH</a>
      </div>
    </header>

    <section class="panel loader-panel" aria-labelledby="source-title">
      <div class="loader-grid">
        <div class="input-wrap">
          <label id="source-title" for="jsonUrl" class="sr-only">JSON 地址</label>
          <input id="jsonUrl" class="url-input" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="输入 JSON URL，例如 https://example.com/images.json" />
          <div class="input-tools">
            <button class="mini-btn" id="pasteBtn" type="button">粘贴</button>
            <button class="mini-btn" id="clearBtn" type="button">清空</button>
          </div>
        </div>
        <button class="primary-btn" id="loadBtn" type="button">加载图片</button>
      </div>

      <div class="presets" aria-label="示例">
        <span class="presets-label">示例：</span>
        <button class="preset" data-url="https://raw.githubusercontent.com/cc63/Fileball/main/icons.json" type="button">Fileball 图标</button>
        <button class="preset" data-url="https://raw.githubusercontent.com/Wo254992/ko/refs/heads/main/emnyicon.json" type="button">Emny 图标</button>
      </div>

      <div class="status" id="status" role="status" aria-live="polite"><div></div></div>

      <div class="history">
        <div class="history-head">
          <span class="history-title">最近访问</span>
          <button class="ghost-btn" id="clearHistoryBtn" type="button">清空历史</button>
        </div>
        <div class="history-list" id="historyList"></div>
      </div>
    </section>

    <section class="panel gallery-panel" aria-labelledby="galleryTitle">
      <div class="gallery-head">
        <div class="title-block">
          <h2 class="gallery-title" id="galleryTitle">图片画廊</h2>
          <div class="gallery-meta" id="galleryMeta">尚未加载数据</div>
        </div>
        <div class="gallery-tools">
          <input class="search" id="searchInput" type="search" placeholder="搜索名称或 URL…" aria-label="搜索图片" />
        </div>
      </div>
      <div class="gallery" id="gallery"></div>
    </section>

    <footer>JSON Image Viewer · GitHub Pages 可直接部署 · MIT</footer>
  </main>

  <div class="modal" id="viewer" role="dialog" aria-modal="true" aria-label="图片预览">
    <div class="viewer-top">
      <div class="viewer-info">
        <div class="viewer-title" id="viewerTitle">-</div>
        <div class="viewer-subtitle" id="viewerUrl">-</div>
      </div>
      <div class="viewer-actions">
        <button class="viewer-btn" id="zoomOutBtn" type="button" aria-label="缩小">−</button>
        <button class="viewer-btn" id="zoomResetBtn" type="button" aria-label="重置缩放">100%</button>
        <button class="viewer-btn" id="zoomInBtn" type="button" aria-label="放大">+</button>
        <button class="viewer-btn" id="viewerOpenBtn" type="button" aria-label="在新窗口打开">↗</button>
        <button class="viewer-btn" id="viewerCloseBtn" type="button" aria-label="关闭">×</button>
      </div>
    </div>
    <div class="viewer-stage">
      <button class="nav-btn prev" id="prevBtn" type="button" aria-label="上一张">‹</button>
      <div class="viewer-image-wrap">
        <img class="viewer-image" id="viewerImage" alt="" />
      </div>
      <button class="nav-btn next" id="nextBtn" type="button" aria-label="下一张">›</button>
      <div class="viewer-count" id="viewerCount">0 / 0</div>
    </div>
  </div>

  <script>
    (() => {
      'use strict';

      const $ = (selector, root = document) => root.querySelector(selector);
      const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
      const HISTORY_KEY = 'json-image-viewer-history-v2';
      const THEME_KEY = 'json-image-viewer-theme';
      const MAX_HISTORY = 20;
      const REQUEST_TIMEOUT = 15000;

      const imageFieldKeys = ['url', 'imageUrl', 'src', 'image', 'icon', 'thumbnail', 'preview', 'cover', 'logo'];
      const nameFieldKeys = ['name', 'title', 'filename', 'label', 'displayName', 'alt'];
      const arrayFieldKeys = ['images', 'icons', 'items', 'list', 'results', 'photos', 'data', 'entries'];

      const els = {
        jsonUrl: $('#jsonUrl'),
        loadBtn: $('#loadBtn'),
        pasteBtn: $('#pasteBtn'),
        clearBtn: $('#clearBtn'),
        status: $('#status'),
        historyList: $('#historyList'),
        clearHistoryBtn: $('#clearHistoryBtn'),
        gallery: $('#gallery'),
        galleryMeta: $('#galleryMeta'),
        searchInput: $('#searchInput'),
        themeBtn: $('#themeBtn'),
        viewer: $('#viewer'),
        viewerImage: $('#viewerImage'),
        viewerTitle: $('#viewerTitle'),
        viewerUrl: $('#viewerUrl'),
        viewerCount: $('#viewerCount'),
        viewerOpenBtn: $('#viewerOpenBtn'),
        viewerCloseBtn: $('#viewerCloseBtn'),
        prevBtn: $('#prevBtn'),
        nextBtn: $('#nextBtn'),
        zoomInBtn: $('#zoomInBtn'),
        zoomOutBtn: $('#zoomOutBtn'),
        zoomResetBtn: $('#zoomResetBtn')
      };

      let currentImages = [];
      let filteredImages = [];
      let currentIndex = -1;
      let zoom = 1;
      let requestController = null;
      let statusTimer = null;

      initTheme();
      renderHistory();
      renderEmpty('输入一个 JSON URL 开始浏览');

      document.addEventListener('click', event => {
        const preset = event.target.closest('[data-url]');
        if (preset) {
          els.jsonUrl.value = preset.dataset.url || '';
          loadImages(els.jsonUrl.value);
        }
      });

      els.loadBtn.addEventListener('click', () => loadImages(els.jsonUrl.value));
      els.jsonUrl.addEventListener('keydown', e => { if (e.key === 'Enter') loadImages(els.jsonUrl.value); });
      els.clearBtn.addEventListener('click', () => { els.jsonUrl.value = ''; els.jsonUrl.focus(); });
      els.pasteBtn.addEventListener('click', pasteUrl);
      els.searchInput.addEventListener('input', () => filterImages(els.searchInput.value));
      els.clearHistoryBtn.addEventListener('click', clearHistory);
      els.themeBtn.addEventListener('click', toggleTheme);

      els.viewerCloseBtn.addEventListener('click', closeViewer);
      els.viewer.addEventListener('click', e => { if (e.target === els.viewer) closeViewer(); });
      els.prevBtn.addEventListener('click', () => moveViewer(-1));
      els.nextBtn.addEventListener('click', () => moveViewer(1));
      els.zoomInBtn.addEventListener('click', () => setZoom(zoom + .25));
      els.zoomOutBtn.addEventListener('click', () => setZoom(zoom - .25));
      els.zoomResetBtn.addEventListener('click', () => setZoom(1));
      els.viewerOpenBtn.addEventListener('click', () => {
        const item = filteredImages[currentIndex];
        if (item?.url) window.open(item.url, '_blank', 'noopener,noreferrer');
      });
      els.viewerImage.addEventListener('wheel', e => {
        e.preventDefault();
        setZoom(zoom + (e.deltaY < 0 ? .1 : -.1));
      }, { passive: false });

      document.addEventListener('keydown', e => {
        if (!els.viewer.classList.contains('open')) return;
        if (e.key === 'Escape') closeViewer();
        if (e.key === 'ArrowLeft') moveViewer(-1);
        if (e.key === 'ArrowRight') moveViewer(1);
        if (e.key === '+' || e.key === '=') setZoom(zoom + .25);
        if (e.key === '-') setZoom(zoom - .25);
        if (e.key === '0') setZoom(1);
      });

      async function loadImages(rawUrl, fromHistory = false) {
        const url = String(rawUrl || '').trim();
        if (!url) return showStatus('请输入 JSON URL', 'error');

        let parsedUrl;
        try {
          parsedUrl = new URL(url);
          if (!['http:', 'https:'].includes(parsedUrl.protocol)) throw new Error('仅支持 http / https URL');
        } catch (error) {
          return showStatus(`URL 无效：${error.message}`, 'error');
        }

        requestController?.abort();
        const controller = new AbortController();
        requestController = controller;
        let timedOut = false;
        const timeoutId = setTimeout(() => { timedOut = true; controller.abort(); }, REQUEST_TIMEOUT);

        setLoading(true);
        showStatus('正在加载 JSON…', 'loading');
        els.galleryMeta.textContent = '正在读取远程数据';

        try {
          const response = await fetch(parsedUrl.href, {
            signal: controller.signal,
            headers: { Accept: 'application/json, text/plain;q=0.9, */*;q=0.8' },
            cache: 'no-store'
          });
          if (!response.ok) throw new Error(`HTTP ${response.status} ${response.statusText}`);
          const text = await response.text();
          if (!text.trim()) throw new Error('响应内容为空');

          let data;
          try {
            data = JSON.parse(text);
          } catch (error) {
            throw new Error(`JSON 解析失败：${error.message}`);
          }

          const images = extractImages(data);
          if (!images.length) throw new Error('没有识别到图片 URL。支持数组、对象数组及常见图片字段。');

          currentImages = dedupeImages(images);
          filteredImages = [...currentImages];
          els.searchInput.value = '';
          renderGallery(filteredImages);

          const displayName = getCollectionName(data, parsedUrl.href);
          saveHistory({ url: parsedUrl.href, name: displayName, timestamp: Date.now() });
          renderHistory();

          els.galleryMeta.textContent = `共 ${currentImages.length} 张图片 · ${formatBytes(new Blob([text]).size)} JSON`;
          showStatus(`加载完成，共识别 ${currentImages.length} 张图片`, 'success');
        } catch (error) {
          if (error.name === 'AbortError') {
            if (timedOut) {
              currentImages = [];
              filteredImages = [];
              renderError('请求超时，请检查 URL、网络或目标服务器响应。');
              showStatus('请求超时，请检查 URL 或服务器响应。', 'error');
              els.galleryMeta.textContent = '请求超时';
            }
          } else {
            console.error(error);
            currentImages = [];
            filteredImages = [];
            renderError(error.message);
            showStatus(formatLoadError(error), 'error');
            els.galleryMeta.textContent = '加载失败';
          }
        } finally {
          clearTimeout(timeoutId);
          if (requestController === controller) {
            requestController = null;
            setLoading(false);
          }
        }
      }

      function extractImages(data) {
        const found = [];
        const visited = new WeakSet();

        function walk(value, fallbackName = '') {
          if (typeof value === 'string') {
            if (looksLikeImageUrl(value)) found.push({ name: fallbackName, url: value });
            return;
          }
          if (!value || typeof value !== 'object') return;
          if (visited.has(value)) return;
          visited.add(value);

          if (Array.isArray(value)) {
            for (const item of value) walk(item, '');
            return;
          }

          let direct = null;
          for (const key of imageFieldKeys) {
            if (typeof value[key] === 'string' && value[key].trim()) {
              direct = value[key].trim();
              break;
            }
          }
          if (direct && looksLikeImageUrl(direct)) {
            found.push({ name: getItemName(value), url: direct });
          }

          for (const key of arrayFieldKeys) {
            if (Array.isArray(value[key])) walk(value[key], getItemName(value));
          }

          for (const [key, child] of Object.entries(value)) {
            if (arrayFieldKeys.includes(key) || imageFieldKeys.includes(key)) continue;
            if (Array.isArray(child) || (child && typeof child === 'object')) walk(child, getItemName(value) || key);
          }
        }

        walk(data);
        return found;
      }

      function looksLikeImageUrl(value) {
        const s = String(value).trim();
        if (!s) return false;
        if (/^data:image\//i.test(s)) return true;
        try {
          const u = new URL(s);
          if (!['http:', 'https:', 'blob:'].includes(u.protocol)) return false;
          return /\.(avif|bmp|gif|ico|jpe?g|png|svg|tiff?|webp)(?:$|[?#])/i.test(u.pathname + u.search) || /(?:image|img|icon|photo|avatar|cover)/i.test(u.pathname);
        } catch {
          return false;
        }
      }

      function getItemName(item) {
        if (!item || typeof item !== 'object') return '';
        for (const key of nameFieldKeys) {
          if (typeof item[key] === 'string' && item[key].trim()) return item[key].trim();
        }
        return '';
      }

      function getCollectionName(data, url) {
        if (data && typeof data === 'object' && !Array.isArray(data)) {
          const name = getItemName(data);
          if (name) return name;
        }
        try {
          const pathname = new URL(url).pathname.split('/').filter(Boolean);
          const filename = pathname.at(-1) || 'JSON 图片集';
          return decodeURIComponent(filename).replace(/\.[^.]+$/, '') || 'JSON 图片集';
        } catch {
          return 'JSON 图片集';
        }
      }

      function dedupeImages(images) {
        const seen = new Set();
        return images.reduce((result, item, index) => {
          const url = String(item.url || '').trim();
          if (!url || seen.has(url)) return result;
          seen.add(url);
          result.push({ name: item.name || `图片 ${index + 1}`, url });
          return result;
        }, []);
      }

      function renderGallery(items) {
        els.gallery.replaceChildren();
        if (!items.length) return renderEmpty('没有匹配的图片');
        const fragment = document.createDocumentFragment();
        items.forEach((item, index) => fragment.appendChild(createCard(item, index)));
        els.gallery.appendChild(fragment);
      }

      function createCard(item, index) {
        const card = document.createElement('article');
        card.className = 'card';

        const thumb = document.createElement('div');
        thumb.className = 'thumb';

        const img = document.createElement('img');
        img.loading = 'lazy';
        img.decoding = 'async';
        img.src = item.url;
        img.alt = item.name;
        img.referrerPolicy = 'no-referrer';
        img.addEventListener('error', () => {
          img.removeAttribute('src');
          thumb.innerHTML = '<span style="color:var(--text-3);font-size:28px">⚠</span>';
        }, { once: true });

        const previewBtn = document.createElement('button');
        previewBtn.type = 'button';
        previewBtn.title = '预览';
        previewBtn.textContent = '⌕';
        previewBtn.addEventListener('click', () => openViewer(index));

        thumb.append(img, previewBtn);

        const body = document.createElement('div');
        body.className = 'card-body';
        const name = document.createElement('div');
        name.className = 'name';
        name.title = item.name;
        name.textContent = item.name;
        const url = document.createElement('div');
        url.className = 'url';
        url.title = item.url;
        url.textContent = item.url;

        const actions = document.createElement('div');
        actions.className = 'card-actions';
        actions.append(
          actionButton('复制', () => copyText(item.url)),
          actionButton('打开', () => window.open(item.url, '_blank', 'noopener,noreferrer'))
        );

        body.append(name, url, actions);
        card.append(thumb, body);
        return card;
      }

      function actionButton(label, handler) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'card-btn';
        button.textContent = label;
        button.addEventListener('click', handler);
        return button;
      }

      function filterImages(raw) {
        const keyword = String(raw || '').trim().toLocaleLowerCase();
        filteredImages = keyword
          ? currentImages.filter(item => `${item.name} ${item.url}`.toLocaleLowerCase().includes(keyword))
          : [...currentImages];
        renderGallery(filteredImages);
        els.galleryMeta.textContent = keyword
          ? `筛选结果：${filteredImages.length} / ${currentImages.length}`
          : `共 ${currentImages.length} 张图片`;
      }

      function openViewer(index) {
        if (!filteredImages[index]) return;
        currentIndex = index;
        zoom = 1;
        renderViewer();
        els.viewer.classList.add('open');
        document.body.style.overflow = 'hidden';
      }

      function closeViewer() {
        els.viewer.classList.remove('open');
        document.body.style.overflow = '';
        els.viewerImage.removeAttribute('src');
      }

      function moveViewer(delta) {
        if (!filteredImages.length) return;
        currentIndex = (currentIndex + delta + filteredImages.length) % filteredImages.length;
        zoom = 1;
        renderViewer();
      }

      function renderViewer() {
        const item = filteredImages[currentIndex];
        if (!item) return;
        els.viewerTitle.textContent = item.name;
        els.viewerUrl.textContent = item.url;
        els.viewerImage.src = item.url;
        els.viewerImage.alt = item.name;
        els.viewerCount.textContent = `${currentIndex + 1} / ${filteredImages.length}`;
        els.prevBtn.disabled = filteredImages.length < 2;
        els.nextBtn.disabled = filteredImages.length < 2;
        setZoom(1);
      }

      function setZoom(value) {
        zoom = Math.min(4, Math.max(.25, value));
        els.viewerImage.style.transform = `scale(${zoom})`;
        els.zoomResetBtn.textContent = `${Math.round(zoom * 100)}%`;
      }

      async function pasteUrl() {
        try {
          const text = await navigator.clipboard.readText();
          if (!text) return showStatus('剪贴板为空', 'warning');
          els.jsonUrl.value = text.trim();
          showStatus('已从剪贴板粘贴 URL', 'success');
        } catch {
          showStatus('浏览器拒绝读取剪贴板，请使用 Ctrl+V 手动粘贴。', 'warning');
        }
      }

      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text);
        } catch {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          textarea.remove();
        }
        showStatus('图片 URL 已复制', 'success');
      }

      function renderHistory() {
        const history = readHistory();
        els.historyList.replaceChildren();
        if (!history.length) {
          const empty = document.createElement('div');
          empty.className = 'history-empty';
          empty.textContent = '暂无历史记录';
          els.historyList.appendChild(empty);
          return;
        }

        const fragment = document.createDocumentFragment();
        for (const item of history) {
          const row = document.createElement('div');
          row.className = 'history-item';

          const load = document.createElement('button');
          load.type = 'button';
          load.className = 'history-load';
          const name = document.createElement('span');
          name.className = 'history-name';
          name.textContent = item.name || '未命名';
          const url = document.createElement('span');
          url.className = 'history-url';
          url.textContent = item.url;
          load.append(name, url);
          load.addEventListener('click', () => {
            els.jsonUrl.value = item.url;
            loadImages(item.url, true);
          });

          const remove = document.createElement('button');
          remove.type = 'button';
          remove.className = 'history-remove';
          remove.title = '删除';
          remove.textContent = '×';
          remove.addEventListener('click', () => {
            const next = readHistory().filter(h => h.url !== item.url);
            writeHistory(next);
            renderHistory();
          });

          row.append(load, remove);
          fragment.appendChild(row);
        }
        els.historyList.appendChild(fragment);
      }

      function readHistory() {
        try {
          const value = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
          return Array.isArray(value) ? value.filter(item => item && item.url) : [];
        } catch {
          localStorage.removeItem(HISTORY_KEY);
          return [];
        }
      }

      function writeHistory(history) {
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(0, MAX_HISTORY)));
      }

      function saveHistory(item) {
        const history = readHistory().filter(h => h.url !== item.url);
        history.unshift(item);
        writeHistory(history);
      }

      function clearHistory() {
        if (!readHistory().length) return;
        if (!confirm('确定清空所有历史记录吗？')) return;
        localStorage.removeItem(HISTORY_KEY);
        renderHistory();
      }

      function showStatus(message, type = 'success') {
        clearTimeout(statusTimer);
        els.status.dataset.type = type;
        $('.status > div', els.status).textContent = message;
        els.status.classList.add('show');
        if (type !== 'loading') statusTimer = setTimeout(() => els.status.classList.remove('show'), 4500);
      }

      function setLoading(loading) {
        els.loadBtn.disabled = loading;
        els.loadBtn.textContent = loading ? '加载中…' : '加载图片';
      }

      function renderEmpty(message) {
        els.gallery.innerHTML = '';
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.innerHTML = '<div class="empty-icon">▧</div>';
        const strong = document.createElement('strong');
        strong.textContent = message;
        const p = document.createElement('p');
        p.textContent = '支持 URL、对象数组、字符串数组以及常见图片字段。';
        empty.append(strong, p);
        els.gallery.appendChild(empty);
      }

      function renderError(message) {
        els.gallery.replaceChildren();
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.innerHTML = '<div class="empty-icon">!</div>';
        const strong = document.createElement('strong');
        strong.textContent = '加载失败';
        const p = document.createElement('p');
        p.textContent = message;
        empty.append(strong, p);
        els.gallery.appendChild(empty);
      }

      function formatLoadError(error) {
        if (/Failed to fetch|NetworkError/i.test(error.message)) {
          return '无法读取 JSON。常见原因是 CORS、网络不可达或目标服务器拒绝跨域请求。';
        }
        return error.message;
      }

      function formatBytes(bytes) {
        if (!bytes) return '0 B';
        const units = ['B', 'KB', 'MB', 'GB'];
        const i = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
        return `${(bytes / (1024 ** i)).toFixed(i ? 1 : 0)} ${units[i]}`;
      }

      function initTheme() {
        const saved = localStorage.getItem(THEME_KEY);
        const theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
        updateThemeButton();
      }

      function toggleTheme() {
        const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.dataset.theme = next;
        localStorage.setItem(THEME_KEY, next);
        updateThemeButton();
      }

      function updateThemeButton() {
        const dark = document.documentElement.dataset.theme === 'dark';
        els.themeBtn.textContent = dark ? '☀' : '☾';
        els.themeBtn.title = dark ? '切换浅色主题' : '切换深色主题';
        els.themeBtn.setAttribute('aria-label', els.themeBtn.title);
      }
    })();
  </script>
  <style>
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  </style>
</body>
</html>
