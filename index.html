async function load(raw){const url=String(raw||'').trim();if(!url)return status('请输入 JSON URL','error');let u;try{u=new URL(url);if(!/^https?:$/.test(u.protocol))throw Error('仅支持 http / https URL')}catch(x){return status('URL 无效：'+x.message,'error')}controller?.abort();controller=new AbortController();let timeout=false;const id=setTimeout(()=>{timeout=true;controller.abort()},TIMEOUT);busy(1);status('正在加载 JSON…','loading');e.meta.textContent='正在读取远程数据';try{const r=await fetch(u.href,{signal:controller.signal,headers:{Accept:'application/json, text/plain;q=.9, */*;q=.8'},cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status} ${r.statusText}`);const text=await r.text();if(!text.trim())throw Error('响应内容为空');let data;try{data=JSON.parse(text)}catch(x){throw Error('JSON 解析失败：'+x.message)}images=dedupe(extract(data));if(!images.length)throw Error('没有识别到图片 URL。支持数组、对象数组及常见图片字段。');filtered=[...images];e.search.value='';gallery();save({url:u.href,name:collection(data,u.href),timestamp:Date.now()});renderHistory();e.meta.textContent=`共 ${images.length} 张图片 · ${bytes(new Blob([text]).size)} JSON`;status(`加载完成，共识别 ${images.length} 张图片`,'success')}catch(x){if(x.name==='AbortError'){if(timeout){images=[];filtered=[];error('请求超时，请检查 URL 或服务器响应。');status('请求超时，请检查 URL 或服务器响应。','error');e.meta.textContent='请求超时'}}else{images=[];filtered=[];error(/Failed to fetch|NetworkError/i.test(x.message)?'无法读取 JSON。常见原因是 CORS、网络不可达或目标服务器拒绝跨域请求。':x.message);status(x.message,'error');e.meta.textContent='加载失败'}}finally{clearTimeout(id);if(controller?.signal.aborted===false)controller=null;busy(0)}}
function extract(data){const out=[],seen=new WeakSet();function walk(v,f=''){if(typeof v==='string'){if(isImage(v))out.push({name:f,url:v});return}if(!v||typeof v!=='object'||seen.has(v))return;seen.add(v);if(Array.isArray(v)){v.forEach(x=>walk(x,''));return}let direct=null;for(const k of imageKeys)if(typeof v[k]==='string'&&v[k].trim()){direct=v[k].trim();break}if(direct&&isImage(direct))out.push({name:itemName(v),url:direct});for(const k of arrayKeys)if(Array.isArray(v[k]))walk(v[k],itemName(v));for(const[k,c]of Object.entries(v))if(!arrayKeys.includes(k)&&!imageKeys.includes(k)&&(Array.isArray(c)||(c&&typeof c==='object')))walk(c,itemName(v)||k)}walk(data);return out}function isImage(v){v=String(v).trim();if(/^data:image\//i.test(v))return true;try{const u=new URL(v);return ['http:','https:','blob:'].includes(u.protocol)&&(/\.(avif|bmp|gif|ico|jpe?g|png|svg|tiff?|webp)(?:$|[?#])/i.test(u.pathname+u.search)||/(image|img|icon|photo|avatar|cover)/i.test(u.pathname))}catch{return false}}function itemName(v){for(const k of nameKeys)if(typeof v?.[k]==='string'&&v[k].trim())return v[k].trim();return ''}function collection(d,url){const n=!Array.isArray(d)&&itemName(d);if(n)return n;try{return decodeURIComponent(new URL(url).pathname.split('/').filter(Boolean).pop()||'JSON 图片集').replace(/\.[^.]+$/,'')}catch{return'JSON 图片集'}}function dedupe(a){const s=new Set;return a.reduce((r,x,i)=>{const u=String(x.url||'').trim();if(u&&!s.has(u)){s.add(u);r.push({name:x.name||`图片 ${i+1}`,url:u})}return r},[])}
function gallery(){e.gallery.replaceChildren();if(!filtered.length)return empty('没有匹配的图片');const f=document.createDocumentFragment();filtered.forEach((x,i)=>f.appendChild(card(x,i)));e.gallery.appendChild(f)}function card(x,i){const c=document.createElement('article');c.className='card';const t=document.createElement('div');t.className='thumb';const img=new Image;img.loading='lazy';img.decoding='async';img.referrerPolicy='no-referrer';img.src=x.url;img.alt=x.name;img.onerror=()=>{img.remove();t.insertAdjacentHTML('afterbegin','<span style="color:var(--muted);font-size:28px">⚠</span>')};const p=document.createElement('button');p.type='button';p.title='预览';p.textContent='⌕';p.onclick=()=>open(i);t.append(img,p);const b=document.createElement('div');b.className='card-body';const n=document.createElement('div');n.className='name';n.title=x.name;n.textContent=x.name;const u=document.createElement('div');u.className='url';u.title=x.url;u.textContent=x.url;const a=document.createElement('div');a.className='card-actions';a.append(action('复制',()=>copy(x.url)),action('打开',()=>window.open(x.url,'_blank','noopener,noreferrer')));b.append(n,u,a);c.append(t,b);return c}function action(label,fn){const b=document.createElement('button');b.type='button';b.className='card-btn';b.textContent=label;b.onclick=fn;return b}function filter(v){const k=String(v||'').trim().toLocaleLowerCase();filtered=k?images.filter(x=>`${x.name} ${x.url}`.toLocaleLowerCase().includes(k)):[...images];gallery();e.meta.textContent=k?`筛选结果：${filtered.length} / ${images.length}`:`共 ${images.length} 张图片`}
function open(i){if(!filtered[i])return;index=i;zoom=1;renderViewer();e.viewer.classList.add('open');document.body.style.overflow='hidden'}function close(){e.viewer.classList.remove('open');document.body.style.overflow='';e.image.removeAttribute('src')}function move(d){if(!filtered.length)return;index=(index+d+filtered.length)%filtered.length;zoom=1;renderViewer()}function renderViewer(){const x=filtered[index];if(!x)return;e.vtitle.textContent=x.name;e.vurl.textContent=x.url;e.image.src=x.url;e.image.alt=x.name;e.count.textContent=`${index+1} / ${filtered.length}`;e.prev.disabled=e.next.disabled=filtered.length<2;setZoom(1)}function setZoom(v){zoom=Math.min(4,Math.max(.25,v));e.image.style.transform=`scale(${zoom})`;e.zreset.textContent=`${Math.round(zoom*100)}%`}
async function paste(){try{const t=await navigator.clipboard.readText();if(!t)return status('剪贴板为空','warning');e.jsonUrl.value=t.trim();status('已从剪贴板粘贴 URL','success')}catch{status('浏览器拒绝读取剪贴板，请使用 Ctrl+V 手动粘贴。','warning')}}async function copy(t){try{await navigator.clipboard.writeText(t)}catch{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}status('图片 URL 已复制','success')}
function read(){try{const x=JSON.parse(localStorage.getItem(H)||'[]');return Array.isArray(x)?x.filter(x=>x?.url):[]}catch{localStorage.removeItem(H);return[]}}function write(x){localStorage.setItem(H,JSON.stringify(x.slice(0,MAX)))}function save(x){write([x,...read().filter(y=>y.url!==x.url)])}function renderHistory(){const h=read();e.history.replaceChildren();if(!h.length){e.history.innerHTML='<div class="history-empty">暂无历史记录</div>';return}const f=document.createDocumentFragment();h.forEach(x=>{const r=document.createElement('div');r.className='history-item';const b=document.createElement('button');b.className='history-load';b.type='button';b.innerHTML=`<span class="history-name"></span><span class="history-url"></span>`;b.querySelector('.history-name').textContent=x.name||'未命名';b.querySelector('.history-url').textContent=x.url;b.onclick=()=>{e.jsonUrl.value=x.url;load(x.url)};const d=document.createElement('button');d.className='history-remove';d.type='button';d.textContent='×';d.title='删除';d.onclick=()=>{write(read().filter(y=>y.url!==x.url));renderHistory()};r.append(b,d);f.append(r)});e.history.append(f)}function clearHistory(){if(read().length&&confirm('确定清空所有历史记录吗？')){localStorage.removeItem(H);renderHistory()}}
function status(m,t='success'){clearTimeout(timer);e.status.dataset.type=t;e.status.firstElementChild.textContent=m;e.status.classList.add('show');if(t!=='loading')timer=setTimeout(()=>e.status.classList.remove('show'),4500)}function busy(v){e.load.disabled=v;e.load.textContent=v?'加载中…':'加载图片'}function empty(m){e.gallery.innerHTML=`<div class="empty"><div class="empty-icon">▧</div><strong>${m}</strong><p>支持 URL、对象数组、字符串数组以及常见图片字段。</p></div>`}function error(m){e.gallery.innerHTML=`<div class="empty"><div class="empty-icon">!</div><strong>加载失败</strong><p></p></div>`;e.gallery.querySelector('p').textContent=m}function bytes(n){if(!n)return'0 B';const u=['B','KB','MB','GB'],i=Math.min(Math.floor(Math.log(n)/Math.log(1024)),3);return`${(n/1024**i).toFixed(i?1:0)} ${u[i]}`}function initTheme(){const s=localStorage.getItem(T),v=s||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=v;themeIcon()}function toggleTheme(){const v=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=v;localStorage.setItem(T,v);themeIcon()}function themeIcon(){const d=document.documentElement.dataset.theme==='dark';e.theme.textContent=d?'☀':'☾';e.theme.title=d?'切换浅色主题':'切换深色主题';e.theme.setAttribute('aria-label',e.theme.title)}})();
