<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f172a">
<meta name="description" content="纯前端 JSON 图片浏览器：输入 JSON URL，自动识别图片并以画廊方式浏览。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234f46e5'/%3E%3Cpath fill='white' d='M17 17h13v13H17zM34 17h13v13H34zM17 34h13v13H17zM34 34h13v13H34z'/%3E%3C/svg%3E">
<title>JSON Image Viewer</title>
<style>
:root{color-scheme:light;--bg:#f4f7fb;--surface:rgba(255,255,255,.92);--solid:#fff;--soft:#f8fafc;--text:#0f172a;--text2:#475569;--muted:#94a3b8;--border:#e2e8f0;--primary:#4f46e5;--primary2:#7c3aed;--danger:#dc2626;--success:#15803d;--warning:#b45309;--shadow:0 12px 35px rgba(15,23,42,.08);--radius:18px}
[data-theme=dark]{color-scheme:dark;--bg:#0b1120;--surface:rgba(15,23,42,.92);--solid:#0f172a;--soft:#111c31;--text:#e5e7eb;--text2:#a5b4fc;--muted:#64748b;--border:#24324a;--primary:#818cf8;--primary2:#a78bfa;--danger:#f87171;--success:#4ade80;--warning:#fbbf24;--shadow:0 20px 50px rgba(0,0,0,.25)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;background:radial-gradient(circle at top right,rgba(99,102,241,.12),transparent 30%),radial-gradient(circle at bottom left,rgba(139,92,246,.09),transparent 28%),var(--bg)}
button,input{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}:focus-visible{outline:3px solid rgba(99,102,241,.35);outline-offset:2px}
.app{width:min(1440px,calc(100% - 32px));margin:auto;padding:24px 0 48px}header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin:10px 0 22px}.brand{display:flex;gap:14px;align-items:center;min-width:0}.brand-mark{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;flex:none;color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary2));box-shadow:0 10px 25px rgba(79,70,229,.25)}.brand-mark svg{width:25px;height:25px}.title h1{margin:0;font-size:clamp(24px,4vw,34px);line-height:1.2;letter-spacing:-.03em}.subtitle{margin:5px 0 0;color:var(--text2);max-width:780px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.icon-btn,.ghost-btn{border:1px solid var(--border);color:var(--text2);background:var(--solid);border-radius:11px;min-height:40px;padding:0 12px;box-shadow:0 1px 2px rgba(15,23,42,.06)}.icon-btn{width:40px;padding:0;display:grid;place-items:center}.icon-btn:hover,.ghost-btn:hover{border-color:var(--primary);color:var(--primary)}.github-icon{width:19px;height:19px;display:block;fill:currentColor}
.panel{border:1px solid var(--border);background:var(--surface);backdrop-filter:blur(16px);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px}.loader-panel,.gallery-panel{padding:20px}.loader-grid{display:grid;grid-template-columns:1fr auto;gap:10px}.input-wrap{position:relative}.url-input{width:100%;min-height:48px;padding:0 100px 0 15px;border:1px solid var(--border);border-radius:13px;background:var(--solid);color:var(--text)}.url-input:focus,.search:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 4px rgba(79,70,229,.1)}.input-tools{position:absolute;right:6px;top:6px;bottom:6px;display:flex;gap:4px}.mini-btn{border:0;border-radius:9px;padding:0 9px;background:var(--soft);color:var(--text2)}.mini-btn:hover{color:var(--primary)}.primary-btn{border:0;min-height:48px;padding:0 20px;border-radius:13px;color:#fff;font-weight:700;background:linear-gradient(135deg,var(--primary),var(--primary2));box-shadow:0 10px 22px rgba(79,70,229,.2)}.primary-btn:disabled{opacity:.6;cursor:wait}
.presets{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}.presets-label,.gallery-meta,.history-empty{color:var(--muted)}.preset{border:1px solid var(--border);background:var(--solid);color:var(--text2);border-radius:999px;padding:6px 10px}.preset:hover{color:var(--primary);border-color:var(--primary)}.status{min-height:0;margin-top:12px;padding:0 14px;border-radius:11px;overflow:hidden;display:grid;grid-template-rows:0fr;transition:.2s}.status>div{min-height:0;overflow:hidden}.status.show{padding-top:10px;padding-bottom:10px;grid-template-rows:1fr;border:1px solid var(--border);background:var(--soft)}.status[data-type=success]{color:var(--success)}.status[data-type=error]{color:var(--danger)}.status[data-type=loading]{color:var(--primary)}.status[data-type=warning]{color:var(--warning)}
.history{margin-top:14px;border-top:1px solid var(--border);padding-top:14px}.history-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:8px}.history-title{font-weight:700}.history-list{display:grid;gap:7px}.history-item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--border);background:var(--solid);border-radius:11px;padding:8px 10px}.history-load{min-width:0;border:0;background:none;color:inherit;text-align:left;padding:0}.history-name{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history-url{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history-remove{border:0;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:8px}.history-remove:hover{color:var(--danger);background:rgba(220,38,38,.08)}
.gallery-head{display:flex;gap:14px;align-items:center;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--border)}.title-block{min-width:0}.gallery-title{margin:0;font-size:18px}.gallery-tools{display:flex;gap:8px;align-items:center}.search{width:min(360px,45vw);min-height:42px;padding:0 13px;border:1px solid var(--border);border-radius:11px;background:var(--solid);color:var(--text)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px;padding-top:16px}.card{min-width:0;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--solid);transition:transform .2s,box-shadow .2s,border-color .2s}.card:hover{transform:translateY(-3px);border-color:rgba(99,102,241,.35);box-shadow:0 14px 30px rgba(15,23,42,.1)}
/* 图片只占缩略图区，刻意缩小，避免与 card-body 重叠；点击图片直接打开大图 */
.thumb{height:205px;position:relative;display:grid;place-items:center;overflow:hidden;padding:12px;background:repeating-conic-gradient(from 45deg,var(--soft) 0 25%,transparent 0 50%) 50%/18px 18px;cursor:zoom-in}.thumb img{display:block;width:auto;height:auto;max-width:92%;max-height:88%;object-fit:contain;object-position:center;transition:opacity .18s}.thumb:hover img{opacity:.92}.card-body{padding:12px;background:var(--solid);position:relative;z-index:1}.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.url{color:var(--muted);font-size:12px;margin-top:4px;height:36px;line-height:18px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;word-break:break-all}.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.card-btn{min-height:35px;border-radius:9px;border:1px solid var(--border);background:var(--soft);color:var(--text2)}.card-btn:hover{border-color:var(--primary);color:var(--primary)}.empty{grid-column:1/-1;padding:70px 20px;text-align:center;color:var(--muted)}.empty-icon{font-size:42px;opacity:.75;margin-bottom:10px}.empty strong{display:block;color:var(--text2);font-size:17px;margin-bottom:4px}
footer{color:var(--muted);font-size:12px;text-align:center;padding:18px 0 0}
.modal{position:fixed;inset:0;z-index:1000;display:none;background:rgba(2,6,23,.82);backdrop-filter:blur(8px)}.modal.open{display:grid;grid-template-rows:auto 1fr}.viewer-top{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:12px;color:#fff}.viewer-info{min-width:0}.viewer-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.viewer-subtitle{opacity:.72;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.viewer-actions{display:flex;gap:6px}.viewer-btn{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;min-width:38px;min-height:38px}.viewer-btn:hover{background:rgba(255,255,255,.16)}.viewer-stage{min-height:0;display:grid;place-items:center;padding:8px 70px 22px;position:relative}.viewer-image-wrap{width:100%;height:100%;display:grid;place-items:center;overflow:hidden}.viewer-image{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center;user-select:none;-webkit-user-drag:none}.nav-btn{position:absolute;top:50%;transform:translateY(-50%);border:0;width:48px;height:72px;border-radius:14px;background:rgba(255,255,255,.08);color:#fff;font-size:30px}.nav-btn:hover{background:rgba(255,255,255,.15)}.prev{left:12px}.next{right:12px}.viewer-count{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);color:rgba(255,255,255,.75);font-size:12px;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.08)}
@media(max-width:800px){.app{width:min(1440px,calc(100% - 20px));padding-top:12px}header{align-items:center}.toolbar{flex-wrap:nowrap}.subtitle{font-size:13px}.loader-grid{grid-template-columns:1fr}.primary-btn{width:100%}.gallery-head{align-items:stretch;flex-direction:column}.gallery-tools,.search{width:100%}.gallery{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.thumb{height:170px}.viewer-stage{padding-left:54px;padding-right:54px}}
@media(max-width:520px){.brand-mark{width:42px;height:42px}.title h1{font-size:23px}.loader-panel,.gallery-panel{padding:14px}.gallery{gap:10px}.card-body{padding:10px}.url{display:none}.thumb{height:150px;padding:10px}.viewer-stage{padding-left:46px;padding-right:46px}.nav-btn{width:38px;height:56px}.viewer-actions .viewer-btn:nth-child(1){display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="app">
<header>
<div class="brand"><div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 4h6v6H4V4Zm10 0h6v6h-6V4ZM4 14h6v6H4v-6Zm10 0h6v6h-6v-6Z" fill="currentColor"/></svg></div><div class="title"><h1>JSON Image Viewer</h1><p class="subtitle">读取 JSON 中的图片地址，以画廊方式浏览。无需后端，数据仅在当前浏览器处理。</p></div></div>
<div class="toolbar"><button class="icon-btn" id="themeBtn" type="button" title="切换主题" aria-label="切换主题">☾</button><a class="icon-btn" href="https://github.com/cloudsonly/JSON-Image-Viewer" target="_blank" rel="noopener noreferrer" title="GitHub 仓库" aria-label="打开 GitHub 仓库"><svg class="github-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .7a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.04c-3.34.73-4.04-1.42-4.04-1.42-.55-1.4-1.34-1.77-1.34-1.77-1.09-.75.08-.74.08-.74 1.2.08 1.84 1.23 1.84 1.23 1.07 1.83 2.8 1.3 3.48.99.11-.77.42-1.3.76-1.6-2.67-.3-5.47-1.34-5.47-5.93 0-1.31.47-2.38 1.23-3.22-.12-.3-.53-1.52.12-3.18 0 0 1-.32 3.3 1.23a11.45 11.45 0 0 1 6 0c2.3-1.55 3.3-1.23 3.3-1.23.65 1.66.24 2.88.12 3.18.76.84 1.23 1.91 1.23 3.22 0 4.6-2.8 5.62-5.48 5.92-0.43.37-.76.92-.76 1.85v2.74c0 .27.2.59.83.49A12 12 0 0 0 12 .7Z"/></svg></a></div>
</header>
<section class="panel loader-panel">
<div class="loader-grid"><div class="input-wrap"><input id="urlInput" class="url-input" type="url" autocomplete="off" placeholder="输入 JSON URL，例如 https://example.com/images.json"><div class="input-tools"><button class="mini-btn" id="pasteBtn" type="button">粘贴</button><button class="mini-btn" id="clearBtn" type="button">清空</button></div></div><button class="primary-btn" id="loadBtn" type="button">加载 JSON</button></div>
<div class="presets"><span class="presets-label">示例：</span><button class="preset" type="button" data-url="https://jsonplaceholder.typicode.com/photos">JSONPlaceholder</button></div>
<div class="status" id="status"><div></div></div>
<div class="history" id="history"><div class="history-head"><span class="history-title">最近访问</span><button class="ghost-btn" id="clearHistory" type="button">清空历史</button></div><div class="history-list" id="historyList"></div></div>
</section>
<section class="panel gallery-panel">
<div class="gallery-head"><div class="title-block"><h2 class="gallery-title">图片画廊</h2><div class="gallery-meta" id="galleryMeta">尚未加载数据</div></div><div class="gallery-tools"><input id="searchInput" class="search" type="search" placeholder="搜索图片名称或 URL"></div></div>
<div class="gallery" id="gallery"><div class="empty"><div class="empty-icon">▧</div><strong>等待加载图片</strong><span>输入一个 JSON 地址后开始浏览</span></div></div>
</section>
<footer>JSON Image Viewer · 数据仅在当前浏览器处理</footer>
</main>
<div class="modal" id="modal" aria-hidden="true">
<div class="viewer-top"><div class="viewer-info"><div class="viewer-title" id="viewerTitle"></div><div class="viewer-subtitle" id="viewerSubtitle"></div></div><div class="viewer-actions"><button class="viewer-btn" id="zoomOut" type="button" title="缩小">−</button><button class="viewer-btn" id="zoomReset" type="button" title="重置">100%</button><button class="viewer-btn" id="zoomIn" type="button" title="放大">＋</button><button class="viewer-btn" id="copyUrl" type="button" title="复制图片地址">⧉</button><button class="viewer-btn" id="openImage" type="button" title="新窗口打开">↗</button><button class="viewer-btn" id="closeModal" type="button" title="关闭">×</button></div></div>
<div class="viewer-stage"><button class="nav-btn prev" id="prevBtn" type="button" aria-label="上一张">‹</button><div class="viewer-image-wrap"><img class="viewer-image" id="viewerImage" alt=""></div><button class="nav-btn next" id="nextBtn" type="button" aria-label="下一张">›</button><div class="viewer-count" id="viewerCount"></div></div>
</div>
<script>
const $=s=>document.querySelector(s);
const state={items:[],filtered:[],index:0,zoom:1,controller:null};
const els={url:$('#urlInput'),load:$('#loadBtn'),status:$('#status'),gallery:$('#gallery'),meta:$('#galleryMeta'),search:$('#searchInput'),history:$('#historyList'),modal:$('#modal'),viewerImage:$('#viewerImage'),viewerTitle:$('#viewerTitle'),viewerSubtitle:$('#viewerSubtitle'),viewerCount:$('#viewerCount')};
function status(message,type='success'){els.status.dataset.type=type;els.status.classList.add('show');els.status.firstElementChild.textContent=message}
function clearStatus(){els.status.classList.remove('show');els.status.firstElementChild.textContent=''}
function isImageUrl(v){return typeof v==='string'&&(/^(https?:)?\/\//i.test(v)||/^data:image\//i.test(v)||/^blob:/i.test(v))}
function titleFromUrl(url){try{const p=new URL(url,location.href);const n=p.pathname.split('/').filter(Boolean).pop();return decodeURIComponent(n||p.hostname)}catch{return url}}
const imageKeys=['url','imageUrl','src','image','icon','thumbnail','preview','cover','logo'];
const arrayKeys=['images','icons','items','list','results','photos','data','entries'];
function extractImages(value,out=[],seen=new Set()){
 if(value==null||seen.has(value))return out;
 if(typeof value==='string'){if(isImageUrl(value))out.push({url:value,name:titleFromUrl(value)});return out}
 if(typeof value!=='object')return out;
 seen.add(value);
 if(Array.isArray(value)){value.forEach(v=>extractImages(v,out,seen));return out}
 for(const k of imageKeys)if(isImageUrl(value[k]))out.push({url:value[k],name:value.name||value.title||titleFromUrl(value[k])});
 for(const k of arrayKeys)if(value[k]!=null)extractImages(value[k],out,seen);
 for(const [k,v] of Object.entries(value)){if(imageKeys.includes(k)||arrayKeys.includes(k))continue;if(typeof v==='object')extractImages(v,out,seen)}
 return out
}
function uniqueItems(items){const seen=new Set();return items.filter(x=>{if(seen.has(x.url))return false;seen.add(x.url);return true})}
function render(){const q=els.search.value.trim().toLowerCase();state.filtered=state.items.filter(x=>!q||`${x.name} ${x.url}`.toLowerCase().includes(q));els.meta.textContent=state.items.length?`共 ${state.items.length} 张图片${q?` · 当前显示 ${state.filtered.length} 张`:''}`:'尚未加载数据';if(!state.filtered.length){els.gallery.innerHTML='<div class="empty"><div class="empty-icon">⌕</div><strong>没有匹配的图片</strong><span>请尝试其他搜索关键词</span></div>';return}els.gallery.innerHTML=state.filtered.map((item,i)=>`<article class="card"><div class="thumb" data-index="${i}" title="点击查看大图"><img src="${escapeAttr(item.url)}" alt="${escapeAttr(item.name)}" loading="lazy" referrerpolicy="no-referrer"></div><div class="card-body"><div class="name" title="${escapeAttr(item.name)}">${escapeHtml(item.name)}</div><div class="url" title="${escapeAttr(item.url)}">${escapeHtml(item.url)}</div><div class="card-actions"><button class="card-btn" data-action="copy" data-index="${i}" type="button">复制地址</button><button class="card-btn" data-action="open" data-index="${i}" type="button">新窗口打开</button></div></div></article>`).join('')}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escapeAttr(s){return escapeHtml(s)}
function openViewer(index){if(!state.filtered.length)return;state.index=Math.max(0,Math.min(index,state.filtered.length-1));state.zoom=1;updateViewer();els.modal.classList.add('open');els.modal.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
function closeViewer(){els.modal.classList.remove('open');els.modal.setAttribute('aria-hidden','true');document.body.style.overflow='';state.zoom=1}
function updateViewer(){const item=state.filtered[state.index];if(!item)return;els.viewerImage.src=item.url;els.viewerImage.alt=item.name;els.viewerImage.style.transform=`scale(${state.zoom})`;els.viewerTitle.textContent=item.name;els.viewerSubtitle.textContent=item.url;els.viewerCount.textContent=`${state.index+1} / ${state.filtered.length}`}
function changeViewer(delta){if(!state.filtered.length)return;state.index=(state.index+delta+state.filtered.length)%state.filtered.length;state.zoom=1;updateViewer()}
function setZoom(z){state.zoom=Math.max(.25,Math.min(4,z));els.viewerImage.style.transform=`scale(${state.zoom})`}
async function copyText(text){try{await navigator.clipboard.writeText(text);status('图片地址已复制','success')}catch{status('复制失败，请手动复制','warning')}}
function saveHistory(url){let h=JSON.parse(localStorage.getItem('jiv-history')||'[]');h=[url,...h.filter(x=>x!==url)].slice(0,8);localStorage.setItem('jiv-history',JSON.stringify(h));renderHistory()}
function renderHistory(){const h=JSON.parse(localStorage.getItem('jiv-history')||'[]');els.history.innerHTML=h.length?h.map((url,i)=>`<div class="history-item"><button class="history-load" data-history="${i}" type="button"><span class="history-name">${escapeHtml(titleFromUrl(url))}</span><span class="history-url">${escapeHtml(url)}</span></button><button class="history-remove" data-remove-history="${i}" type="button" aria-label="删除">×</button></div>`).join(''):'<div class="history-empty">暂无历史记录</div>'}
async function load(){const url=els.url.value.trim();if(!url){status('请输入 JSON URL','warning');els.url.focus();return}if(state.controller)state.controller.abort();const controller=new AbortController();state.controller=controller;els.load.disabled=true;status('正在加载 JSON…','loading');try{const timer=setTimeout(()=>controller.abort(),15000);const res=await fetch(url,{signal:controller.signal,headers:{Accept:'application/json,text/plain,*/*'}});clearTimeout(timer);if(!res.ok)throw new Error(`HTTP ${res.status}`);const data=await res.json();const items=uniqueItems(extractImages(data));if(controller.signal.aborted)throw new Error('请求已取消');state.items=items;els.search.value='';render();saveHistory(url);status(`加载成功，共发现 ${items.length} 张图片`,'success');if(!items.length)status('JSON 已加载，但没有识别到图片地址','warning')}catch(e){if(e.name==='AbortError')status('加载超时或请求已取消','error');else status(`加载失败：${e.message}`,'error')}finally{if(state.controller===controller)state.controller=null;els.load.disabled=false}}
$('#loadBtn').addEventListener('click',load);els.url.addEventListener('keydown',e=>{if(e.key==='Enter')load()});els.search.addEventListener('input',render);$('#clearBtn').addEventListener('click',()=>{els.url.value='';clearStatus();els.url.focus()});$('#pasteBtn').addEventListener('click',async()=>{try{els.url.value=await navigator.clipboard.readText();status('已粘贴剪贴板内容','success')}catch{status('无法读取剪贴板，请手动粘贴','warning')}});document.querySelectorAll('.preset').forEach(b=>b.addEventListener('click',()=>{els.url.value=b.dataset.url;load()}));
els.gallery.addEventListener('click',e=>{const thumb=e.target.closest('.thumb');if(thumb){openViewer(Number(thumb.dataset.index));return}const btn=e.target.closest('[data-action]');if(!btn)return;const item=state.filtered[Number(btn.dataset.index)];if(!item)return;if(btn.dataset.action==='copy')copyText(item.url);else window.open(item.url,'_blank','noopener,noreferrer')});
$('#closeModal').addEventListener('click',closeViewer);$('#prevBtn').addEventListener('click',()=>changeViewer(-1));$('#nextBtn').addEventListener('click',()=>changeViewer(1));$('#zoomIn').addEventListener('click',()=>setZoom(state.zoom+.25));$('#zoomOut').addEventListener('click',()=>setZoom(state.zoom-.25));$('#zoomReset').addEventListener('click',()=>setZoom(1));$('#copyUrl').addEventListener('click',()=>copyText(state.filtered[state.index]?.url||''));$('#openImage').addEventListener('click',()=>{const u=state.filtered[state.index]?.url;if(u)window.open(u,'_blank','noopener,noreferrer')});els.modal.addEventListener('click',e=>{if(e.target===els.modal)closeViewer()});document.addEventListener('keydown',e=>{if(!els.modal.classList.contains('open'))return;if(e.key==='Escape')closeViewer();if(e.key==='ArrowLeft')changeViewer(-1);if(e.key==='ArrowRight')changeViewer(1);if(e.key==='+'||e.key==='=')setZoom(state.zoom+.25);if(e.key==='-')setZoom(state.zoom-.25)});els.viewerImage.addEventListener('wheel',e=>{if(!els.modal.classList.contains('open'))return;e.preventDefault();setZoom(state.zoom+(e.deltaY<0?.15:-.15))},{passive:false});
$('#clearHistory').addEventListener('click',()=>{localStorage.removeItem('jiv-history');renderHistory()});els.history.addEventListener('click',e=>{const loadBtn=e.target.closest('[data-history]');if(loadBtn){const h=JSON.parse(localStorage.getItem('jiv-history')||'[]');const u=h[Number(loadBtn.dataset.history)];if(u){els.url.value=u;load()}return}const rm=e.target.closest('[data-remove-history]');if(rm){const h=JSON.parse(localStorage.getItem('jiv-history')||'[]');h.splice(Number(rm.dataset.removeHistory),1);localStorage.setItem('jiv-history',JSON.stringify(h));renderHistory()}});
const savedTheme=localStorage.getItem('jiv-theme');if(savedTheme==='dark')document.documentElement.dataset.theme='dark';$('#themeBtn').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme==='dark';if(dark)delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme='dark';localStorage.setItem('jiv-theme',dark?'light':'dark');$('#themeBtn').textContent=dark?'☾':'☀'});if(document.documentElement.dataset.theme==='dark')$('#themeBtn').textContent='☀';renderHistory();
</script>
</body>
</html>
